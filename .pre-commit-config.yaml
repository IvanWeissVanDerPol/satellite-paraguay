# Pre-commit hooks for satellite-paraguay
# Auto-runs black, flake8, isort, mypy, pycln on every commit.
# Install with: pre-commit install
# Run manually with: pre-commit run --all-files

# See https://pre-commit.com for more information.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.(tex|bib|md|yml)$|.*\.bst$'
      - id: end-of-file-fixer
        exclude: '\.(tex|bib|md)$'
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-case-conflict
      - id: check-json
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ['--branch=main', '--branch=develop']
        # Prevent accidental direct commits to protected branches

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3
        args: ['--line-length=120']
        files: '^(src|tests|scripts)/.*\.py$'

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ['--profile=black', '--line-length=120']
        files: '^(src|tests|scripts)/.*\.py$'

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        files: '^(src|tests|scripts)/.*\.py$'
        # Config in .flake8

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        # Note: requires [dev] deps installed (mypy, types-PyYAML, types-requests)
        # Skipped by default to keep commits fast — enable in CI only
        files: '^(src|scripts)/.*\.py$'
        args: ['--explicit-package-bases', '--ignore-missing-imports', '--allow-redef']
        additional_dependencies: ['types-PyYAML', 'types-requests']

  - repo: https://github.com/hadialqattan/pycln
    rev: v2.6.0
    hooks:
      - id: pycln
        args: ['--check']
        files: '^(src|tests|scripts)/.*\.py$'

  - repo: local
    hooks:
      - id: check-claims
        name: Honest-reporting guard
        entry: python3 scripts/check_claims.py
        language: system
        pass_filenames: false
        # Skip in pre-commit by default — runs in CI
        stages: [manual]

      - id: check-latex
        name: LaTeX + bibliography check
        entry: python3 scripts/check_latex.py
        language: system
        pass_filenames: false
        # Skip in pre-commit by default — runs in CI
        stages: [manual]