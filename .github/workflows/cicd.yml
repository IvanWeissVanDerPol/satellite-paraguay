name: CI/CD

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Sundays at 06:00 UTC
    - cron: '0 6 * * 0'

env:
  PYTHON_DEFAULT: '3.12'

jobs:
  # ====== Lint job (fast feedback) ======
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install lint deps
        run: pip install flake8 isort black mypy
      - name: Black
        run: black --check --diff scripts/ tests/ src/
      - name: isort
        run: isort --check --diff scripts/ tests/ src/
      - name: Flake8
        run: flake8 src/ tests/ scripts/
      - name: MyPy
        run: mypy --explicit-package-bases --no-warn-unused-ignores scripts/ src/
      - name: pyupgrade (py310-plus check)
        run: |
          pip install pyupgrade
          find src/ scripts/ -name "*.py" -exec pyupgrade --py310-plus --keep-runtime-typing {} +
      - name: pycln (unused imports)
        run: |
          pip install pycln
          pycln src/ tests/ scripts/
      - name: vulture (dead code scan, informational)
        run: |
          pip install vulture
          vulture src/ scripts/ --min-confidence 60 || echo "vulture found dead code (informational only); see https://github.com/jendrikseipp/vulture"
        continue-on-error: true
      # Honest-reporting guard (added 2026-08-11): fails the build if any
      # unsanctioned high-headline numeric claim (F1>0.7, R²>0.7, mAP>0.6,
      # MAE<5) appears outside ACTUAL_RESULTS.md / README.md / WORKLOG_*.md /
      # papers/drafts/*/paper.{md,tex} etc. See scripts/check_claims.py
      # docstring for the sanctioning rules.
      - name: Honest-Reporting Guard (check_claims.py)
        run: python3 scripts/check_claims.py

      - name: Ethics Gate (check_ethics.py)
        run: python3 scripts/check_ethics.py

  # ====== Multi-Python test matrix ======
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        test-type: ['unit']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          # 2026-08-13: Use requirements-ci.txt to avoid GDAL-bound deps
          # (rasterio, geopandas) that fail to build on CI runners without
          # system libs. Then install the package itself with --no-deps.
          # This is the same pattern as .github/workflows/ci.yml.
          pip install -e ".[ci]"
          pip install -e . --no-deps
      - name: Run unit tests
        run: |
          python -m pytest tests/ \
            -m "not slow and not gpu and not performance and not network" \
            --no-cov \
            -v \
            --tb=short
      - name: Run property tests
        run: |
          python -m pytest tests/test_properties.py \
            -m property \
            --no-cov \
            -v || true

  # ====== Coverage report ======
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -e ".[ci]"
      - run: pip install -e . --no-deps
      - name: Generate coverage
        run: |
          python -m pytest tests/ \
            -m "not slow and not gpu and not performance and not network" \
            --cov=src \
            --cov=scripts \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=3
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # ====== Property-based tests ======
  property:
    name: Property Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -e ".[ci]"
      - run: pip install -e . --no-deps
      - name: Run property tests
        run: |
          python -m pytest tests/test_properties.py \
            -m property \
            --no-cov \
            --hypothesis-seed=42 \
            -v || true

  # ====== Performance benchmarks ======
  performance:
    name: Performance
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install GDAL system libraries
        # rasterio/geopandas need GDAL at runtime. Tests use pytest.importorskip
        # to skip when not available, but Performance job installs it explicitly
        # so the benchmarks actually run.
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin libgeos-dev
          gdalinfo --version
      - name: Install Python deps (with rasterio + geopandas)
        run: |
          pip install -e ".[ci]" --no-deps
          pip install rasterio geopandas
      - name: Run performance tests
        run: |
          python -m pytest tests/test_performance.py \
            -m performance \
            --no-cov \
            --benchmark-only \
            --benchmark-autosave

  # ====== Build & deploy ======
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, coverage]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build package
        run: |
          pip install build
          python -m build
      - name: Upload artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist
          path: dist/
          if-no-files-found: error  # Scenario 2 mitigation

  # ====== Dependency audit ======
  dependencies:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -e ".[ci]"
      - run: pip install -e . --no-deps
      - name: Audit dependencies
        run: python3 scripts/audit_dependencies.py

  # ====== Weekly cron ======
  weekly:
    name: Weekly Cron
    runs-on: ubuntu-latest
    if: github.event.schedule
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -e ".[ci]"
      - run: pip install -e . --no-deps
      - name: Run weekly analysis
        run: bash scripts/weekly_run.sh
      - name: Upload results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: weekly-results
          path: outputs/weekly/
          if-no-files-found: error  # Scenario 2 mitigation
      - name: Check alerts
        run: python3 scripts/alert_cron_failures.py
        if: always()
