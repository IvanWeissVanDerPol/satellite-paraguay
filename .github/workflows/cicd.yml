name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Sundays at 06:00 UTC
    - cron: '0 6 * * 0'

env:
  PYTHON_DEFAULT: '3.12'

jobs:
  # ====== Lint job (fast feedback) ======
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lint deps
        run: pip install flake8 isort black mypy
      - name: Black
        run: black --check --diff scripts/ tests/ src/
      - name: isort
        run: isort --check --diff scripts/ tests/ src/
      - name: Flake8
        run: flake8 --max-line-length=120 --extend-ignore=E203,W503,E225 scripts/ tests/ src/
      - name: MyPy
        run: mypy scripts/ src/
      # Honest-reporting guard (added 2026-08-11): fails the build if any
      # unsanctioned high-headline numeric claim (F1>0.7, R²>0.7, mAP>0.6,
      # MAE<5) appears outside ACTUAL_RESULTS.md / README.md / WORKLOG_*.md /
      # papers/drafts/*/paper.{md,tex} etc. See scripts/check_claims.py
      # docstring for the sanctioning rules.
      - name: Honest-Reporting Guard (check_claims.py)
        run: python3 scripts/check_claims.py

  # ====== Multi-Python test matrix ======
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        test-type: ['unit']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          # 2026-08-13: Use requirements-ci.txt to avoid GDAL-bound deps
          # (rasterio, geopandas) that fail to build on CI runners without
          # system libs. Then install the package itself with --no-deps.
          # This is the same pattern as .github/workflows/ci.yml.
          pip install -r requirements-ci.txt
          pip install -e . --no-deps
      - name: Run unit tests
        run: |
          python -m pytest tests/ \
            -m "not slow and not gpu and not performance and not network" \
            --no-cov \
            -v \
            --tb=short
      - name: Run property tests
        run: |
          python -m pytest tests/test_properties.py \
            -m property \
            --no-cov \
            -v

  # ====== Coverage report ======
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-ci.txt
      - run: pip install -e . --no-deps
      - name: Generate coverage
        run: |
          python -m pytest tests/ \
            -m "not slow and not gpu and not performance and not network" \
            --cov=src \
            --cov=scripts \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=3
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # ====== Property-based tests ======
  property:
    name: Property Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-ci.txt
      - run: pip install -e . --no-deps
      - name: Run property tests
        run: |
          python -m pytest tests/test_properties.py \
            -m property \
            --no-cov \
            --hypothesis-seed=42 \
            -v

  # ====== Performance benchmarks ======
  performance:
    name: Performance
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-ci.txt
      - run: pip install -e . --no-deps
      - name: Run performance tests
        run: |
          python -m pytest tests/test_performance.py \
            -m performance \
            --no-cov \
            --benchmark-only \
            --benchmark-autosave

  # ====== Build & deploy ======
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, coverage]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build package
        run: |
          pip install build
          python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: dist
          path: dist/

  # ====== Dependency audit ======
  dependencies:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-ci.txt
      - run: pip install -e . --no-deps
      - name: Audit dependencies
        run: python3 scripts/audit_dependencies.py

  # ====== Weekly cron ======
  weekly:
    name: Weekly Cron
    runs-on: ubuntu-latest
    if: github.event.schedule
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-ci.txt
      - run: pip install -e . --no-deps
      - name: Run weekly analysis
        run: bash scripts/weekly_run.sh
      - name: Upload results
        uses: actions/upload-artifact@v3
        with:
          name: weekly-results
          path: outputs/weekly/
      - name: Check alerts
        run: python3 scripts/alert_cron_failures.py
        if: always()
