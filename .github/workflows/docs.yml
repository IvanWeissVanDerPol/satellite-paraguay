name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "*.md"

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Check docs build
        run: |
          echo "Docs check would happen here"
          # Real docs: sphinx-build -b html docs/ _build/html
          ls -la docs/

  validate-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: gaurav-nelson/github-action-markdown-link-check@5c5dfc0ac2e225883c0e5f03a85311ec2830d368  # v1
        with:
          folder-path: "docs/"
          max-depth: 3
          ignore-paths: "docs/TODO.md,docs/REPORT.md"
          # Localhost URLs are dev-only and not resolvable in CI
          config-file: '.github/markdown-link-check.json' 
