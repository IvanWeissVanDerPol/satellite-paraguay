name: Build & Deploy Dashboard

'on':
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "src/**"
      - "requirements.txt"
      - "pyproject.toml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install -e .
          pip install -e ".[ci]"
      - name: Test dashboard imports
        run: |
          python -c "import sys; sys.path.insert(0, 'dashboard'); import app" || echo "dashboard import test"

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Deploy to staging
        env:
          STAGING_DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
        run: |
          echo "Deploy to staging would happen here"
          # Real deployment: rsync / scp to staging server
