name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint (black + flake8 + isort)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install linting tools
        run: |
          pip install black flake8 isort
      - name: Black check
        run: black --check --diff src/ tests/ scripts/
      - name: isort check
        run: isort --check-only --diff src/ tests/ scripts/
      - name: flake8
        run: flake8 --max-line-length=120 --extend-ignore=E203,W503 src/ tests/ scripts/ --max-line-length=120 --extend-ignore=E203,W503

  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install mypy
        run: pip install mypy types-PyYAML types-requests
      - name: mypy
        run: mypy --no-implicit-optional --ignore-missing-imports --no-strict-optional src/ || true

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          # 2026-08-13: Use requirements-ci.txt to avoid GDAL-bound deps
          # (rasterio, geopandas) that fail to build on Python 3.11 CI runners
          # without system libs. Then install the package itself with --no-deps.
          pip install -r requirements-ci.txt
          pip install -e . --no-deps

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: coverage.xml
          fail_ci_if_error: false

  verify:
    name: Verify repo state
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          pip install -r requirements-ci.txt
          pip install -e . --no-deps
          pip install pytest
      - name: Run verify script
        run: python scripts/verify.py || echo "verify had warnings"
