name: CI

'on':
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint (black + flake8 + isort)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.10"
      - name: Install linting tools
        run: |
          pip install black flake8 isort
      - name: Black check
        run: black --check --diff src/ tests/ scripts/
      - name: isort check
        run: isort --check-only --diff src/ tests/ scripts/
      - name: flake8
        run: flake8 src/ tests/ scripts/

  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.10"
      - name: Install mypy
        run: pip install mypy types-PyYAML types-requests
      - name: mypy
        run: mypy --explicit-package-bases --no-warn-unused-ignores scripts/ src/

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          # 2026-08-13: Use requirements-ci.txt to avoid GDAL-bound deps
          # (rasterio, geopandas) that fail to build on Python 3.11 CI runners
          # without system libs. Then install the package itself with --no-deps.
          pip install -e ".[ci]"
          pip install -e . --no-deps

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v7  # SHA pinning deferred
        with:
          file: coverage.xml
          fail_ci_if_error: false

  verify:
    name: Verify repo state
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.10"
      - name: Install
        run: |
          pip install -e ".[ci]"
          pip install -e . --no-deps
          pip install pytest
      - name: Run verify script
        run: python scripts/verify.py || echo "verify had warnings"

  # Fast inner-loop feedback (~2s wall-clock). Runs the 7 test files
  # from scripts/run_tests_fast.sh + the 3 always-on guards
  # (check_claims.py, check_latex.py, verify_bib_dois.py --summary).
  # Catches the regression-protection layer failures (numerical
  # consistency drift, missing \input{} refs, bare \cite{} usage,
  # citation completeness, LaTeX syntax, bibliography, citation
  # patterns) before the slower full pytest + defense-check jobs run.
  # Added 2026-09-08 after Round-10 caught 2 regressions that the
  # full-suite check would have caught but the agent's manual
  # inner-loop subset (previously just 5 files) missed.
  fast-feedback:
    name: Fast feedback (inner-loop subset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -e ".[ci]"
          pip install -e . --no-deps
          pip install pytest
      - name: Run fast feedback (7 tests + 3 guards, ~5s)
        run: |
          bash scripts/run_tests_fast.sh

  # Defense check: 12 critical checks (7 base + 4 Tier-6 regression tests
  # + data audit freshness). Catches: broken citations, numerical drift,
  # dangling \input{} refs, unescaped %-in-braces, missing bib entries.
  # Refuses merge if any critical check fails.
  defense-check:
    name: Defense check (Tier-6 regression layer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -e ".[ci]"
          pip install -e . --no-deps
          pip install pytest
      - name: Run 12 defense checks
        run: |
          python scripts/defense_check.py --verbose
      - name: Run Tier-6 regression tests directly
        # Run the 4 new test files explicitly so failures show file/line info
        # (defense_check aggregates but pytest output is more verbose).
        run: |
          pytest tests/test_numerical_consistency.py \
                 tests/test_input_references.py \
                 tests/test_latex_safety.py \
                 tests/test_citation_completeness.py \
                 --no-cov -v --tb=short
