name: SBOM

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cyclonedx-bom
          pip install -e ".[ci]" --no-deps

      - name: Generate CycloneDX SBOM (from requirements.txt)
        run: |
          mkdir -p sbom
          # Build from pip-freeze of the installed environment, validated by pyproject.toml
          python -m pip freeze --local --require-virtualenv \
            | cyclonedx-py requirements - \
              --pyproject pyproject.toml \
              --mc-type application \
              --of JSON \
              --spec-version 1.6 \
              -o sbom/satellite-paraguay-sbom.json \
              --validate

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom
          path: sbom/satellite-paraguay-sbom.json
          retention-days: 90
          if-no-files-found: error