name: SBOM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cyclonedx-bom
          pip install -e ".[ci]" --no-deps

      - name: Generate CycloneDX SBOM (from requirements.txt)
        run: |
          mkdir -p sbom
          # Build from pip-freeze of the installed environment, validated by pyproject.toml
          python -m pip freeze --local --require-virtualenv \
            | cyclonedx-py requirements - \
              --pyproject pyproject.toml \
              --mc-type application \
              --of JSON \
              --spec-version 1.6 \
              -o sbom/satellite-paraguay-sbom.json \
              --validate

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sbom
          path: sbom/satellite-paraguay-sbom.json
          retention-days: 90
          if-no-files-found: error