name: Secret scanning

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    # Run on both push to main AND on pull requests to main.
    # Gitleaks is now a required CI check (defense-in-depth: don't rewrite history).
    # PR comments disabled due to gitleaks-action permission issues with fork PRs.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Disable PR comments to avoid permission errors
          GITLEAKS_ENABLE_PR_COMMENTS: "false"
          # Upload SARIF for the security tab
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"