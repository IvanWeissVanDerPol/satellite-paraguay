name: LaTeX compile (per paper)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile-papers:
    name: Compile ${{ matrix.paper }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        paper:
          - p0011_yvutu_deforestation
          - p0010_yvyra_carbon_credits
          - p0012_yvy_indigenous
          - p0025_yrupe_yield
          - p0026_kai_poaching
          - p0035_tatakua_air_quality
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX
        run: |
          sudo apt-get update
          # 2026-08-13: Added texlive-publishers (for elsarticle.cls) and
          # texlive-science (for various scientific packages). 4 of 6 papers
          # use \documentclass{elsarticle} (Elsevier class).
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-lang-spanish \
            texlive-bibtex-extra \
            texlive-publishers \
            texlive-science \
            biber \
            latexmk
      - name: Compile paper
        working-directory: papers/drafts/${{ matrix.paper }}
        run: |
          # Run latexmk which auto-runs latex+bibtex+biblatex as needed
          latexmk -pdf -interaction=nonstopmode paper.tex
          # Fallback: manual sequence with biber for elsarticle-num
          if [ ! -f paper.pdf ]; then
            echo "latexmk failed, trying manual sequence with biber..."
            pdflatex -interaction=nonstopmode paper.tex
            biber paper || bibtex paper
            pdflatex -interaction=nonstopmode paper.tex
            pdflatex -interaction=nonstopmode paper.tex
          fi
          # Verify final PDF
          ls -la paper.pdf 2>&1 || echo "PDF not generated"
      - name: Verify PDF
        working-directory: papers/drafts/${{ matrix.paper }}
        run: |
          test -f paper.pdf || (echo "compile failed, no paper.pdf" && exit 1)
          test -s paper.pdf || (echo "paper.pdf is empty" && exit 1)
          file paper.pdf
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: paper-${{ matrix.paper }}
          path: papers/drafts/${{ matrix.paper }}/paper.pdf
