name: Vulture nightly scan

# Daily scan for dead code with vulture. Runs on a schedule (not on PRs)
# so that PR noise doesn't block merges. vulture results are posted as
# a job summary; no PR is opened automatically.

'on':
  schedule:
    # 03:00 UTC = 23:00 PYT (UTC-4) — late evening, before Monday Dependabot
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulture:
    name: Dead code scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install vulture
        run: pip install vulture

      - name: Run vulture (confidence >= 60%)
        run: |
          mkdir -p reports
          vulture src/ scripts/ \
            --min-confidence 60 \
            --sort-by-size \
            > reports/vulture-60.txt 2>&1 || true
          vulture src/ scripts/ \
            --min-confidence 80 \
            --sort-by-size \
            > reports/vulture-80.txt 2>&1 || true
          echo "=== vulture @ 60% confidence ==="
          cat reports/vulture-60.txt
          echo ""
          echo "=== vulture @ 80% confidence ==="
          cat reports/vulture-80.txt

      - name: Upload vulture reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: vulture-reports
          path: reports/vulture-*.txt
          retention-days: 90
          if-no-files-found: warn