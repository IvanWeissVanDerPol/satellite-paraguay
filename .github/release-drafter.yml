# Release drafter — auto-generate release notes from PRs
# Docs: https://github.com/release-drafter/release-drafter

name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
version-resolver:
  major:
    labels: ['breaking', 'major']
  minor:
    labels: ['feature', 'minor']
  patch:
    labels: ['bug', 'fix', 'patch', 'dependencies']
  default: patch
categories:
  - title: '🚨 Breaking Changes'
    labels: ['breaking', 'major']
  - title: '🚀 New Features'
    labels: ['feature', 'enhancement']
  - title: '🐛 Bug Fixes'
    labels: ['bug', 'fix']
  - title: '📦 Dependencies'
    labels: ['dependencies']
  - title: '📚 Documentation'
    labels: ['documentation', 'docs']
  - title: '🧪 Tests'
    labels: ['tests', 'ci']
  - title: '🔧 Maintenance'
    labels: ['chore', 'maintenance', 'refactor']
change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
template: |
  ## Changes

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
