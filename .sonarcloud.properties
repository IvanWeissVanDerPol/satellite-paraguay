# SonarCloud configuration
# Docs: https://docs.sonarcloud.io/project-setup/

sonar.projectKey=IvanWeissVanDerPol_satellite-paraguay
sonar.organization=ivanweissvanderpol
sonar.projectName=satellite-paraguay
sonar.projectDescription=Multi-temporal earth observation of Paraguay — 6 papers from one Python package
sonar.projectVersion=0.1.0

# Source code
sonar.sources=src
sonar.tests=tests

# Python coverage (uses coverage.xml from pytest-cov)
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=report.xml

# Exclusions
sonar.exclusions=\
  **/__pycache__/**,\
  **/.venv/**,\
  **/build/**,\
  **/dist/**,\
  **/*.egg-info/**,\
  papers/drafts/*/output/**,\
  src/papers/*/output/**

sonar.test.exclusions=tests/test_pipelines.py,tests/test_real_download*.py,tests/test_performance.py

# Encoding
sonar.sourceEncoding=UTF-8

# Language-specific
sonar.python.version=3.10,3.11,3.12

# Quality gate (default Sonar way is too strict for a thesis repo with stub work)
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300